<!DOCTYPE html>
<html>
<head>
    <title>Galería de imágenes</title>

    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .galeria img {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Mi galeria</h1>

    <div class="galeria">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWqvUbpFhd6NPpJFrhSbnFfLqhVe5Exy7kntBK_ccv5A&s=10">

</html>
